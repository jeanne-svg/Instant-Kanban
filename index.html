<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>領料即時作業看板</title>
<style>
:root{
 --bg:#f3f5f7; --line:#e5e7eb; --text:#1f2933; --muted:#6b7280;
 --blue:#2563eb; --green:#16a34a; --red:#dc2626; --orange:#d97706; --purple:#7c3aed;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Microsoft JhengHei","PingFang TC",Arial,sans-serif;background:var(--bg);color:var(--text);
 display:flex;flex-direction:column;overflow:hidden}

/* ---------- Frozen top section ---------- */
.frozen{flex:0 0 auto;background:var(--bg)}

header{background:white;border-bottom:1px solid var(--line);padding:14px 22px;
 display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px}
.title-row{display:flex;align-items:baseline;gap:8px}
h1{margin:0;font-size:21px;font-weight:700;color:#111827}
.tag{color:var(--blue);font-size:14px;font-weight:600}
.sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.meta{text-align:right;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.pill.ok{background:#e6f9f0;color:var(--green)}
.pill.info{background:#e8f0fe;color:var(--blue)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:14px 22px 0}
.card{background:white;border-radius:10px;padding:14px 10px;text-align:center;box-shadow:0 1px 3px #0001}
.card .lbl{font-size:12.5px;color:var(--muted)}
.card .num{font-size:26px;font-weight:800;margin-top:4px}
.num.all{color:#111827}.num.transfer{color:#111827}.num.urgent{color:var(--red)}
.num.notready{color:var(--orange)}.num.ready{color:var(--green)}.num.picked{color:var(--purple)}

.controls{margin:12px 22px 10px;background:white;border-radius:10px;padding:10px 12px;
 display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 1px 3px #0001}
.controls select,.controls input{padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;background:white;font-size:13px}
.controls input#search{min-width:160px}
.legend{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);line-height:1.5}
.legend b{color:#374151}
.legend .warn{color:var(--red);font-weight:600}

/* ---------- Scrollable table area ---------- */
.table-wrap{flex:1;overflow:auto;margin:0 22px 16px;background:white;border-radius:10px;box-shadow:0 1px 3px #0001}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:#eef1f4;color:#374151;text-align:left;padding:10px 8px;
 border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
tbody td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:#f9fafb}
.ok{color:var(--green);font-weight:700}.ng{color:var(--red);font-weight:700}
.disabled{color:#9ca3af}
.picked-row{opacity:.5}
.overdue td{background:#fdecec}
.overdue .no{color:var(--red)}
.preparerInput{width:88px;padding:5px 6px;font-size:12.5px;border:1px solid #d1d5db;border-radius:5px}
.hrs{font-variant-numeric:tabular-nums}
.typeno .t{font-size:11.5px;color:var(--muted)}
.typeno .n{font-weight:700}
.daystat{white-space:nowrap;font-size:12.5px;color:#374151}
.daystat b{font-variant-numeric:tabular-nums}
.daystat b.ng{color:var(--red)}
.daystat b.ok{color:var(--green)}
</style>
</head>
<body>

<div class="frozen">
 <header>
  <div>
   <div class="title-row"><h1>領料即時作業看板</h1><span class="tag">(當月資料)</span></div>
   <div class="sub">資料來源：ERP資料庫 (MOCI02、MOCI03、INVI08、INVI11)</div>
  </div>
  <div class="meta">
   <span>管理者：資訊部 ｜ 查詢：生產管理部-倉庫 / 生產管理部</span>
   <span class="pill ok"><span class="dot"></span>SQL 連線正常</span>
   <span class="pill info" id="refreshPill">3 秒後刷新</span>
  </div>
 </header>

 <div class="cards">
  <div class="card"><div class="lbl">本月全部</div><div class="num all" id="cAll">0</div></div>
  <div class="card"><div class="lbl">轉撥單</div><div class="num transfer" id="cTransfer">0</div></div>
  <div class="card"><div class="lbl">急單</div><div class="num urgent" id="cUrgent">0</div></div>
  <div class="card"><div class="lbl">未備料</div><div class="num notready" id="cNotReady">0</div></div>
  <div class="card"><div class="lbl">已備料</div><div class="num ready" id="cReady">0</div></div>
  <div class="card"><div class="lbl">已取貨</div><div class="num picked" id="cPicked">0</div></div>
 </div>

 <div class="controls">
  <select id="createDateFilter"><option value="today">建立日期：當天</option><option value="">建立日期：全部</option></select>
  <select id="factory"><option value="">工廠：全部</option></select>
  <select id="transfer"><option value="">轉撥：全部</option><option value="yes">轉撥單</option><option value="no">非轉撥</option></select>
  <select id="urgentFilter"><option value="">急單：全部</option><option value="yes">急單</option><option value="no">非急單</option></select>
  <select id="status"><option value="">備料：全部</option><option value="ready">已備料</option><option value="notready">未備料</option></select>
  <select id="pickedFilter"><option value="">取貨：全部</option><option value="yes">已取貨</option><option value="no">未取貨</option></select>
  <select id="person"><option value="">開單：全部</option></select>
  <select id="borrow"><option value="">借出：全部</option><option value="yes">借出單</option><option value="no">非借出</option></select>
  <input id="search" placeholder="搜尋製令單號／領料單號／工廠／開單人員">
  <div class="legend">
   排序：<b>①單據日期 ②急單 ③單據 ④單別 ⑤單號 ⑥備料 ⑦工廠取貨</b><br>
   <span class="warn">※ 逾期未取置頂</span>
  </div>
 </div>
</div>

<div class="table-wrap">
 <table>
  <thead><tr>
   <th>急單</th><th>工廠</th><th>單別單號</th><th>製令單號</th><th>開單人員</th><th>建立日期</th><th>單據日期</th>
   <th>單據</th><th>備料</th><th>備料人員</th><th>備料時間</th><th>工廠取貨</th>
   <th title="統計今天建立的這批單據（建立日期＝今天），不論單據日期是過去、今天或預先開立的未來日期：&#10;未備料＝尚未核單、尚未取貨的張數&#10;待取＝尚未取貨的張數合計（未備料＋已備料未取）">當日單據統計</th>
  </tr></thead>
  <tbody id="tbody"></tbody>
 </table>
</div>

<script>
let rows=[];
const permission={urgent:true,pickedUp:true,preparer:true};
let actions=JSON.parse(localStorage.getItem("materialBoardActions")||"{}");

function norm(s){return String(s??"").trim().replace(/\s+/g,"").replace(/　/g,"")}
function findKey(obj,names){
 const keys=Object.keys(obj);
 for(const n of names){const x=norm(n);const k=keys.find(a=>norm(a)===x);if(k)return k}
 for(const n of names){const x=norm(n);const k=keys.find(a=>norm(a).includes(x));if(k)return k}
 return null;
}
function parseDate(v){
 if(v instanceof Date)return v;
 if(typeof v==="number"){return new Date(Math.round((v-25569)*86400*1000))}
 let s=String(v??"").trim().replace(/\//g,"-");
 let m=s.match(/(\d{3})[-](\d{1,2})[-](\d{1,2})/);
 if(m)return new Date(+m[1]+1911,+m[2]-1,+m[3]);
 let d=new Date(s);return isNaN(d)?new Date(0):d;
}
function timeOfDaySeconds(v){
 if(v instanceof Date)return v.getHours()*3600+v.getMinutes()*60+v.getSeconds();
 if(typeof v==="number"){const frac=v-Math.floor(v);return Math.round(frac*86400)}
 const s=String(v??"").trim();
 const m=s.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
 if(m)return(+m[1])*3600+(+m[2])*60+(+(m[3]||0));
 return null;
}
function calcPrepHours(r){
 const c=timeOfDaySeconds(r.createTime),m=timeOfDaySeconds(r.modifyTime);
 if(c==null||m==null)return null;
 let diff=m-c;if(diff<0)diff+=86400;
 return diff/3600;
}
function formatPrepHours(r){
 const h=calcPrepHours(r);
 if(h==null)return '<span class="disabled">—</span>';
 const sign=h>=24?' <span style="color:#c92a2a">(跨日)</span>':'';
 return `<span class="hrs">${h.toFixed(2)} 小時</span>${sign}`;
}
function keyOf(r){return `${r.factory}|${r.type}|${r.no}`}
function isOverdue(r){
 const picked=!!actions[keyOf(r)]?.pickedUp;
 if(picked)return false;
 const d=parseDate(r.date);
 const today=new Date();today.setHours(0,0,0,0);
 const dd=new Date(d);dd.setHours(0,0,0,0);
 return dd.getTime()<today.getTime();
}
// 依「工廠」統計今天建立的這批單據（建立日期＝今天，與單據日期無關）：
//  notReady＝今天建立、尚未核單（未備料）、且尚未取貨的張數 → 需要通知人員備料或通知生管改單據日期
//  pending＝今天建立、且尚未取貨的張數合計（不論單據日期是過去、今天或預先開立的未來日期）→ 待取
function computeFactoryStats(){
 const today=new Date();today.setHours(0,0,0,0);
 const stats={};
 rows.forEach(r=>{
  const cd=parseDate(r.createDate);cd.setHours(0,0,0,0);
  if(cd.getTime()!==today.getTime())return; // 只統計「建立日期＝今天」這一批
  if(!!actions[keyOf(r)]?.pickedUp)return; // 已取貨的不列入統計
  stats[r.factory]=stats[r.factory]||{notReady:0,pending:0};
  stats[r.factory].pending++;
  if(r.confirm!=="Y")stats[r.factory].notReady++;
 });
 return stats;
}

function normalizeData(data){
 if(!data.length)return [];
 const sample=data[0];
 const K={
  factory:findKey(sample,["工廠","廠別","工廠別"]),
  type:findKey(sample,["單別","單據別","單別代號"]),
  no:findKey(sample,["領料單號","領料號","單號"]),
  orderNo:findKey(sample,["製令單號","製令單","工單號"]),
  person:findKey(sample,["開單人員","開單人","建立人員","開單者"]),
  approver:findKey(sample,["核單人","核單人員","覆核人","覆核人員","核准人"]),
  date:findKey(sample,["單據日期","單據日","開單日期","日期"]),
  createDate:findKey(sample,["建立日期","建檔日期","登錄日期"]),
  confirm:findKey(sample,["確認碼","確認狀態","備料確認"]),
  pages:findKey(sample,["單據頁數","列印數量","列印"]),
  transfer:findKey(sample,["轉撥","轉撥單","轉撥碼"]),
  borrow:findKey(sample,["借出","借出單","借出碼"]),
  createTime:findKey(sample,["建立時間"]),
  modifyTime:findKey(sample,["修改時間"])
 };
 return data.map(x=>({
  factory:x[K.factory]??"",type:x[K.type]??"",no:x[K.no]??"",orderNo:x[K.orderNo]??"",
  person:x[K.person]??"",approver:x[K.approver]??"",date:x[K.date]??"",createDate:x[K.createDate]??"",
  confirm:String(x[K.confirm]??"").trim().toUpperCase(),
  pages:Number(String(x[K.pages]??"").replace(/,/g,""))||0,
  transfer:String(x[K.transfer]??"").trim().toUpperCase()==="Y",
  borrow:String(x[K.borrow]??"").trim().toUpperCase()==="Y",
  createTime:K.createTime?x[K.createTime]:null,
  modifyTime:K.modifyTime?x[K.modifyTime]:null
 })).filter(x=>x.no!=="");
}

function sortRows(a,b){
 // ※ 逾期未取（單據日期已過且尚未工廠取貨）永遠置頂
 const ao=isOverdue(a),bo=isOverdue(b);
 if(ao!==bo)return ao?-1:1;

 // 已取貨（反灰）永遠置尾
 const ap=!!actions[keyOf(a)]?.pickedUp,bp=!!actions[keyOf(b)]?.pickedUp;
 if(ap!==bp)return ap?1:-1;

 // ①單據日期（小至大）
 const d=parseDate(a.date)-parseDate(b.date);if(d)return d;

 // ②急單（✓優先）
 const au=!!actions[keyOf(a)]?.urgent,bu=!!actions[keyOf(b)]?.urgent;
 if(au!==bu)return au?-1:1;

 // ③單據（已提供→未列印）
 const apd=a.pages>0,bpd=b.pages>0;
 if(apd!==bpd)return apd?-1:1;

 // ④單別（小至大）
 const t=String(a.type).localeCompare(String(b.type),"zh-Hant",{numeric:true});
 if(t)return t;

 // ⑤單號（小至大）
 const noCmp=String(a.no).localeCompare(String(b.no),"zh-Hant",{numeric:true});
 if(noCmp)return noCmp;

 // ⑥備料（未備料→已備料＝未核單→已核單）
 const ar=a.confirm==="Y",br=b.confirm==="Y";
 if(ar!==br)return ar?1:-1;

 // ⑦工廠取貨（未取貨→已取貨，已由上方分組處理，此處僅作保底比較）
 return 0;
}

function render(){
 if(document.activeElement&&document.activeElement.classList&&document.activeElement.classList.contains("preparerInput"))return;

 let q=norm(document.getElementById("search").value).toLowerCase();
 let cdf=document.getElementById("createDateFilter").value;
 let f=document.getElementById("factory").value;
 let tr=document.getElementById("transfer").value;
 let uf=document.getElementById("urgentFilter").value;
 let st=document.getElementById("status").value;
 let pf=document.getElementById("pickedFilter").value;
 let pr=document.getElementById("person").value;
 let bo=document.getElementById("borrow").value;

 const today=new Date();today.setHours(0,0,0,0);

 let data=rows.filter(r=>{
  const ready=r.confirm==="Y",urgent=!!actions[keyOf(r)]?.urgent,picked=!!actions[keyOf(r)]?.pickedUp;
  const text=norm(`${r.factory}${r.type}${r.no}${r.orderNo}${r.person}`).toLowerCase();
  const cd=parseDate(r.createDate);cd.setHours(0,0,0,0);
  return (!q||text.includes(q))
   &&(!cdf||cd.getTime()===today.getTime())
   &&(!f||r.factory===f)
   &&(!tr||(tr==="yes"?r.transfer:!r.transfer))
   &&(!uf||(uf==="yes"?urgent:!urgent))
   &&(!st||(st==="ready"?ready:!ready))
   &&(!pf||(pf==="yes"?picked:!picked))
   &&(!pr||r.person===pr)
   &&(!bo||(bo==="yes"?r.borrow:!r.borrow));
 }).sort(sortRows);

 document.getElementById("cAll").textContent=rows.length;
 document.getElementById("cTransfer").textContent=rows.filter(r=>r.transfer).length;
 document.getElementById("cReady").textContent=rows.filter(r=>r.confirm==="Y").length;
 document.getElementById("cNotReady").textContent=rows.filter(r=>r.confirm==="N").length;
 document.getElementById("cUrgent").textContent=rows.filter(r=>actions[keyOf(r)]?.urgent).length;
 document.getElementById("cPicked").textContent=rows.filter(r=>actions[keyOf(r)]?.pickedUp).length;

 const factoryStats=computeFactoryStats();

 document.getElementById("tbody").innerHTML=data.map(r=>{
  const k=keyOf(r),a=actions[k]||{},urgent=!!a.urgent,picked=!!a.pickedUp,overdue=isOverdue(r);
  const preparer=(a.preparer!==undefined&&a.preparer!==null)?a.preparer:(r.approver||"");
  const rowClass=[picked?'picked-row':'',overdue?'overdue':''].filter(Boolean).join(" ");
  const fs=factoryStats[r.factory]||{notReady:0,pending:0};
  return `<tr class="${rowClass}">
  <td>${permission.urgent?`<input type="checkbox" ${urgent?'checked':''} onchange="toggle('${escAttr(k)}','urgent',this.checked)">`:'<span class="disabled">—</span>'}</td>
  <td>${esc(r.factory)}</td>
  <td class="typeno"><div class="t">${esc(r.type)}</div><div class="n ${overdue?'no':''}">${esc(r.no)}</div></td>
  <td>${esc(r.orderNo)||'<span class="disabled">—</span>'}</td>
  <td>${esc(r.person)}</td>
  <td>${formatDate(r.createDate)}</td>
  <td>${formatDate(r.date)}</td>
  <td class="${r.pages>0?'ok':'ng'}">${r.pages>0?'已提供':'未提供'}</td>
  <td class="${r.confirm==='Y'?'ok':'ng'}">${r.confirm==='Y'?'完成':'未完成'}</td>
  <td>${permission.preparer?`<input class="preparerInput" type="text" placeholder="填寫姓名" value="${esc(preparer)}" onchange="setPreparer('${escAttr(k)}',this.value)">`:esc(preparer)||'<span class="disabled">—</span>'}</td>
  <td>${formatPrepHours(r)}</td>
  <td>${permission.pickedUp?`<input type="checkbox" ${picked?'checked':''} ${r.confirm==='Y'?'':'disabled title="尚未備料完成，無法勾選工廠取貨"'} onchange="toggle('${escAttr(k)}','pickedUp',this.checked)">`:'<span class="disabled">—</span>'}</td>
  <td class="daystat">未備料 <b class="${fs.notReady>0?'ng':'ok'}">${fs.notReady}</b> ／ 待取 <b>${fs.pending}</b></td>
  </tr>`;
 }).join("");
}

function persist(){localStorage.setItem("materialBoardActions",JSON.stringify(actions))}
function toggle(k,field,v){
 if(field==='pickedUp'&&v){
  const row=rows.find(r=>keyOf(r)===k);
  if(row&&row.confirm!=="Y"){alert('尚未備料完成，無法勾選工廠取貨');render();return}
 }
 actions[k]=actions[k]||{};actions[k][field]=v;actions[k][field+"Time"]=new Date().toLocaleString("zh-TW");persist();render()
}
function setPreparer(k,v){actions[k]=actions[k]||{};actions[k].preparer=v.trim();actions[k].preparerTime=new Date().toLocaleString("zh-TW");persist();render()}
function formatDate(v){let d=parseDate(v);return d.getTime()?`${d.getFullYear()-1911}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`:esc(v)}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function escAttr(v){return String(v).replace(/\\/g,"\\\\").replace(/'/g,"\\'")}

function setFactories(){
 let s=document.getElementById("factory");
 s.innerHTML='<option value="">工廠：全部</option>'+[...new Set(rows.map(r=>r.factory).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join("");
}
function setPersons(){
 let s=document.getElementById("person");
 s.innerHTML='<option value="">開單：全部</option>'+[...new Set(rows.map(r=>r.person).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join("");
}

// ---- demo dataset (stand-in for the ERP query, until it's wired to a real API) ----
function toROC(d){return `${d.getFullYear()-1911}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`}

// ---- demo dataset (stand-in for the ERP query, until it's wired to a real API) ----
// 日期一律以「執行當下」為基準動態產生，確保每次打開看到的都是近期資料，而不是寫死的固定日期。
// 建立日期（系統建檔日）與單據日期（單據本身的日期）刻意拆開：
//  - 多數當天建立、當天單據（一般狀況）
//  - 少數當天建立、單據日期較早（表示這張單早該取，尚未取貨 → 逾期）
//  - 少數當天建立、單據日期較晚（預先開立作業，等未來日期才需要備料/取貨）
//  - 少數建立日期非當天（用來示範「建立日期：全部」篩選才會看到的資料）
function loadDemo(){
 const factories=["A廠","B廠","C廠"];
 const types=["1410","1420","1430"];
 const people=["王XX","李XX","陳XX","林XX","黃XX"];
 const today=new Date();today.setHours(0,0,0,0);
 const gen=[];
 const N=90;
 for(let i=0;i<N;i++){
  const f=factories[i%factories.length];
  const t=types[(i*3)%types.length];

  // 建立日期：約7成為當天，其餘落在前1~3天（示範「建立日期：全部」才會顯示的資料）
  const createOffset=Math.random()<0.7?0:-(1+Math.floor(Math.random()*3));
  const createDate=new Date(today);createDate.setDate(createDate.getDate()+createOffset);

  // 單據日期：多數與建立日期同天；部分較早（可能逾期未取）；部分較晚（預先開立）
  const roll=Math.random();
  let docOffset;
  if(roll<0.6) docOffset=0;
  else if(roll<0.85) docOffset=-(1+Math.floor(Math.random()*4));
  else docOffset=1+Math.floor(Math.random()*2);
  const docDate=new Date(createDate);docDate.setDate(docDate.getDate()+docOffset);

  const pages=Math.random()<0.85?(1+Math.floor(Math.random()*3)):0;
  // 業務規則：單據未提供就不可能備料完成
  const confirm=pages>0?(Math.random()<0.85?"Y":"N"):"N";

  gen.push({
   工廠:f,單別:t,
   領料單號:`${createDate.getFullYear()-1911}${String(createDate.getMonth()+1).padStart(2,"0")}${String(createDate.getDate()).padStart(2,"0")}${String(i).padStart(3,"0")}`,
   製令單號:`WO${1200000+i}`,開單人員:people[i%people.length],核單人:people[(i+2)%people.length],
   建立日期:toROC(createDate),單據日期:toROC(docDate),
   確認碼:confirm,單據頁數:pages,
   轉撥:Math.random()<0.53?"Y":"N",借出:Math.random()<0.08?"Y":"N",
   建立時間:`${String(8+Math.floor(Math.random()*4)).padStart(2,"0")}:${String(Math.floor(Math.random()*60)).padStart(2,"0")}:00`,
   修改時間:`${String(12+Math.floor(Math.random()*6)).padStart(2,"0")}:${String(Math.floor(Math.random()*60)).padStart(2,"0")}:00`
  });
 }
 rows=normalizeData(gen);
 // 預設帶入幾筆急單／已取貨，方便一打開就看得出排序效果
 rows.slice(0,8).forEach(r=>{actions[keyOf(r)]={...(actions[keyOf(r)]||{}),urgent:true}});
 rows.filter(r=>r.confirm==="Y").slice(0,Math.floor(rows.length*0.5)).forEach(r=>{actions[keyOf(r)]={...(actions[keyOf(r)]||{}),pickedUp:true}});
 persist();
 setFactories();setPersons();render();
}

["search","createDateFilter","factory","transfer","urgentFilter","status","pickedFilter","person","borrow"]
 .forEach(id=>document.getElementById(id).addEventListener("input",render));

 actions=JSON.parse(localStorage.getItem("materialBoardActions")||"{}");
 render();
},3000);
